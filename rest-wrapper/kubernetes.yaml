apiVersion: apps/v1
kind: Deployment
metadata:
  name: table-aware-chunker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: table-aware-chunker
  template:
    metadata:
      labels:
        app: table-aware-chunker
    spec:
      containers:
        - name: api
          image: table-aware-chunker-rest:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: TAC_ALLOW_URL_SOURCES
              value: "false"
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
      volumes:
        - name: temporary-files
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: table-aware-chunker
spec:
  type: ClusterIP
  selector:
    app: table-aware-chunker
  ports:
    - name: http
      port: 8000
      targetPort: http
